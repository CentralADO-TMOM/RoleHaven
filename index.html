<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Central ADO / TMOM - Firebase</title>
<script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
<script type="importmap">{"imports":{"firebase/app":"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js","firebase/database":"https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js"}}</script>
<style>
:root{--rojo:#d10024}*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}body{background:#f2f2f2;color:#111}
header{background:white;border-bottom:4px solid var(--rojo);padding:14px 18px;display:flex;justify-content:space-between;align-items:center}header h1{color:var(--rojo);font-size:20px}
.container{max-width:900px;margin:18px auto;padding:0 12px}.card{background:white;border-radius:14px;padding:18px;box-shadow:0 4px 14px rgba(0,0,0,.07);margin-bottom:16px}
.tabs{display:flex;gap:8px;margin-bottom:14px}.tab{flex:1;padding:11px;border-radius:10px;border:2px solid var(--rojo);background:#fff;color:var(--rojo);font-weight:900;cursor:pointer}.tab.active{background:var(--rojo);color:#fff}
label{font-size:12px;font-weight:800;color:#666;text-transform:uppercase}input,select{width:100%;padding:11px;border-radius:9px;border:1.5px solid #ddd;margin:6px 0 12px;font-size:14px}
.btn{background:var(--rojo);color:#fff;border:none;padding:12px;border-radius:9px;font-weight:900;width:100%;cursor:pointer}.btn-sec{background:#111}
.badge{background:var(--rojo);color:#fff;padding:3px 8px;border-radius:20px;font-size:11px}.result{border:1.5px solid #eee;border-radius:12px;padding:12px;margin-bottom:10px}.similar{border:1.5px dashed var(--rojo);background:#fff5f5}
#boletoWrap{display:none}.ticket-real{background:#fff;width:100%;max-width:480px;margin:0 auto;border-radius:6px;border:1px solid #e5e5e5;padding:22px 22px 12px}
.ticket-real .compra{text-align:center;color:var(--rojo);font-weight:900;font-size:22px}.line-red-short{width:160px;height:2px;background:var(--rojo);margin:8px auto 16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}.logo-box{flex:1;min-height:60px;display:flex;align-items:center}.logo-box img{max-height:54px;max-width:200px;object-fit:contain}.logo-box .txt-logo{color:var(--rojo);font-weight:900;font-size:34px}
.qr{width:90px;height:90px;background:#fff;border:2px solid #000;display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(9,1fr);gap:1px;padding:3px}.qr div{background:#fff}.qr div.b{background:#000}
.divider{height:3px;background:var(--rojo);margin:12px 0}.field{margin-bottom:10px}.field .lbl{font-size:11px;color:#666;font-weight:700}.field .val{font-size:26px;font-weight:900;line-height:1.1;text-transform:uppercase;word-break:break-word}.field.small-val .val{font-size:22px}
.footer{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-top:12px}.legal{font-size:7.5px;line-height:1.25;max-width:58%;font-weight:600}.barcode{height:44px;width:180px;background:repeating-linear-gradient(90deg,#000 0 2px,transparent 2px 4px,#000 4px 6px,transparent 6px 7px,#000 7px 9px,transparent 9px 12px);margin-bottom:2px}
.admin-item{display:flex;justify-content:space-between;align-items:center;padding:9px;border:1px solid #eee;border-radius:9px;margin-bottom:6px}
#passModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:999;align-items:center;justify-content:center;padding:20px}#passModal .box{background:white;border-radius:16px;padding:24px;max-width:360px;width:100%;border-top:5px solid var(--rojo)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
</style>
</head>
<body>
<header><h1>Central TMOM / ADO <small id="status" style="font-size:11px;color:green">● Conectado</small></h1><img id="logoHeader" style="height:40px;display:none"></header>
<div class="container">
<div class="tabs"><button id="tabPas" class="tab active" onclick="switchTab('pasajero',this)">PASAJERO</button><button id="tabAdm" class="tab" onclick="requestAdmin(this)">ADMIN</button></div>
<div id="view-pasajero" class="card">
<label>Operador</label><select id="opBusca"><option value="TODOS">Todos</option><option value="TMOM">TMOM</option><option value="ADO">ADO</option></select>
<label>Tu nombre de rol</label><input id="nombreRol" placeholder="Ej: alexmartz057">
<div class="grid2"><div><label>Desde</label><input id="desdeBusca" placeholder="Pachuca"></div><div><label>Hasta</label><input id="hastaBusca" placeholder="Puebla"></div></div>
<button class="btn" onclick="buscar()">Buscar</button>
<div id="resultados" style="margin-top:16px"></div>
<hr style="margin:20px 0">
<h3 style="color:var(--rojo);margin-bottom:8px">Servicios Activos Ahora</h3>
<div id="activos"><small>Cargando de Firebase...</small></div>
</div>
<div id="view-admin" class="card" style="display:none">
<label>SUBIR LOGO (se sincroniza a todos)</label><input type="file" id="logoInput" accept="image/*">
<h3 style="margin:14px 0 8px;color:#d10024">Agregar Servicio</h3>
<label>Operador</label><select id="opAdd"><option>TMOM</option><option>ADO</option></select>
<label>Empresa</label><input id="empresaAdd" placeholder="AUTOBUSES TMOM / ADO">
<div class="grid2"><div><label>Desde</label><input id="desdeAdd"></div><div><label>Hasta</label><input id="hastaAdd"></div></div>
<div class="grid2"><div><label>Hora</label><input id="horaAdd" type="time" value="14:30"></div><div><label>Día</label><input id="diaAdd" type="date"></div></div>
<label>Precio en Robux R$</label><input id="precioAdd" type="number" placeholder="650">
<div id="paradasBox" style="margin:8px 0"></div><button class="btn btn-sec" style="margin-bottom:10px" onclick="addParada()">+ Parada intermedia</button>
<button class="btn" onclick="agregarServicio()">Guardar en Firebase</button>
<h3 style="margin:18px 0 8px;color:#d10024">Servicios en la nube</h3><div id="listaServ"></div>
<button class="btn btn-sec" style="margin-top:14px" onclick="logoutAdmin()">Cerrar sesión Admin</button>
</div>
<div id="boletoWrap" class="card"><h3 style="color:var(--rojo);margin-bottom:12px">Tu Boleto</h3><div id="boletoReal" class="ticket-real"></div><button class="btn" style="margin-top:12px" onclick="window.print()">Imprimir</button><button class="btn btn-sec" style="margin-top:8px" onclick="document.getElementById('boletoWrap').style.display='none'">Cerrar</button></div>
</div>
<div id="passModal"><div class="box"><h2>Insertar contraseña</h2><p style="font-size:13px;color:#555;margin-bottom:10px">Contraseña de Admin</p><input id="passInput" type="password" placeholder="Contraseña"><div id="passError" style="color:var(--rojo);font-size:12px;display:none;margin-bottom:10px">Contraseña incorrecta</div><button class="btn" onclick="checkPass()">Entrar</button><button class="btn btn-sec" style="margin-top:8px" onclick="closePass()">Cancelar</button></div></div>
<script type="module">
import { initializeApp } from "firebase/app";
import { getDatabase, ref, set, onValue, remove, push } from "firebase/database";
const firebaseConfig = {
  apiKey: "AIzaSyDyYyJk3lEIjWl9B0yLcd3B7f8eIYHWn_M",
  authDomain: "centraladotmom.firebaseapp.com",
  databaseURL: "https://centraladotmom-default-rtdb.firebaseio.com",
  projectId: "centraladotmom",
  storageBucket: "centraladotmom.firebasestorage.app",
  messagingSenderId: "524503776536",
  appId: "1:524503776536:web:b60e7d3c115b43049f326d"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const serviciosRef = ref(db, 'centralTMOM/servicios');
const logoRef = ref(db, 'centralTMOM/logo');
let servicios=[];let paradas=[];let logoData='';let isAdmin=false;let pendingBtn=null;
const normalize = t => t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
const normalizePass = t => t.toLowerCase().replace(/\s+/g,'').trim();
window.switchTab=(t,btn)=>{if(t==='admin'&&!isAdmin){window.requestAdmin(btn);return;}document.getElementById('view-pasajero').style.display=t==='pasajero'?'block':'none';document.getElementById('view-admin').style.display=t==='admin'?'block':'none';document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));if(btn)btn.classList.add('active');}
window.requestAdmin=(btn)=>{pendingBtn=btn;document.getElementById('passModal').style.display='flex';document.getElementById('passInput').value='';document.getElementById('passError').style.display='none';setTimeout(()=>document.getElementById('passInput').focus(),100);}
window.closePass=()=>document.getElementById('passModal').style.display='none';
window.checkPass=()=>{if(normalizePass(document.getElementById('passInput').value)==='unionadotmom'){isAdmin=true;closePass();document.getElementById('view-pasajero').style.display='none';document.getElementById('view-admin').style.display='block';document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));document.getElementById('tabAdm').classList.add('active');}else{document.getElementById('passError').style.display='block';}}
window.logoutAdmin=()=>{isAdmin=false;document.getElementById('view-admin').style.display='none';document.getElementById('view-pasajero').style.display='block';document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));document.getElementById('tabPas').classList.add('active');}
document.getElementById('passInput').addEventListener('keydown',e=>{if(e.key==='Enter')window.checkPass();});
document.getElementById('logoInput').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{set(logoRef, r.result).catch(err=>alert('Error logo: '+err));};r.readAsDataURL(f);});
window.addParada=()=>{const n=prompt('Parada intermedia:');if(n){paradas.push(n);renderParadas();}}
window.renderParadas=()=>{document.getElementById('paradasBox').innerHTML=paradas.map((p,i)=>`<span style='background:#ffe5e5;padding:4px 8px;border-radius:12px;font-size:12px;margin:2px;display:inline-block'>${p} <b onclick='paradas.splice(${i},1);renderParadas()' style='cursor:pointer'>x</b></span>`).join('');}
window.agregarServicio=()=>{const s={id:Date.now(),operador:document.getElementById('opAdd').value,desde:document.getElementById('desdeAdd').value,hasta:document.getElementById('hastaAdd').value,empresa:document.getElementById('empresaAdd').value,precio:document.getElementById('precioAdd').value,hora:document.getElementById('horaAdd').value,dia:document.getElementById('diaAdd').value,paradas:[...paradas]};if(!s.desde||!s.hasta||!s.empresa)return alert('Falta desde/hasta/empresa');const newRef=push(serviciosRef);set(newRef,s).then(()=>{paradas=[];window.renderParadas();alert('Guardado en Firebase');}).catch(e=>alert('Error Firebase: '+e));}
onValue(serviciosRef,(snap)=>{const data=snap.val();servicios=data?Object.values(data):[];renderAdmin();renderActivos();window._data=data;document.getElementById('status').textContent='● Conectado ('+servicios.length+')';document.getElementById('status').style.color='green';},(err)=>{document.getElementById('status').textContent='● Error: '+err.message;document.getElementById('status').style.color='red';document.getElementById('activos').innerHTML='<b style=color:red>Error Firebase: revisa las Reglas en modo prueba</b>';});
onValue(logoRef,(snap)=>{logoData=snap.val()||'';if(logoData){document.getElementById('logoHeader').src=logoData;document.getElementById('logoHeader').style.display='block';}});
function renderAdmin(){const c=document.getElementById('listaServ');if(!servicios.length){c.innerHTML='<small>Sin servicios</small>';return;}c.innerHTML=servicios.map(s=>`<div class='admin-item'><div><span class='badge'>${s.operador}</span> <b>${s.desde} → ${s.hasta}</b><br><small>${s.empresa} | R$ ${s.precio} | ${s.hora}</small></div><button class='btn' style='width:auto;padding:6px 10px' onclick='borrar(${s.id})'>Borrar</button></div>`).join('');}
function renderActivos(){const c=document.getElementById('activos');if(!servicios.length){c.innerHTML='<small>No hay servicios activos</small>';return;}c.innerHTML=servicios.map(s=>`<div class='result'><span class='badge'>${s.operador} ACTIVO</span> <b>${s.desde} → ${s.hasta}</b> <small>${s.empresa} | ${s.hora} | R$ ${s.precio}</small></div>`).join('');}
window.borrar=(id)=>{if(!window._data)return;for(let k in window._data){if(window._data[k].id==id){remove(ref(db,'centralTMOM/servicios/'+k));}}}
window.buscar=()=>{const op=normalize(document.getElementById('opBusca').value),nombre=document.getElementById('nombreRol').value||'JUAN PEREZ',desde=normalize(document.getElementById('desdeBusca').value),hasta=normalize(document.getElementById('hastaBusca').value);if(!desde||!hasta)return alert('Pon desde y hasta');let exactos=servicios.filter(s=>{const sd=normalize(s.desde),sh=normalize(s.hasta);const mOp=op==='todos'||normalize(s.operador)===op;const mD=sd.includes(desde)||desde.includes(sd)||(s.paradas||[]).some(p=>normalize(p).includes(desde));const mH=sh.includes(hasta)||hasta.includes(sh)||(s.paradas||[]).some(p=>normalize(p).includes(hasta));return mOp&&mD&&mH;});let similares=[];if(!exactos.length){similares=servicios.filter(s=>{const sd=normalize(s.desde),sh=normalize(s.hasta);return sd.includes(desde)||desde.includes(sd)||sh.includes(hasta)||hasta.includes(sh);}).slice(0,5);}const r=document.getElementById('resultados');if(!exactos.length&&!similares.length){r.innerHTML=`<div style='background:#fff0f0;padding:12px;border-radius:10px'><h3>Malas noticias, ${nombre}</h3><p>No encontramos buses</p></div>`;return;}let html='';if(exactos.length){html+=`<h3 style='color:#d10024;margin-bottom:8px'>¡Buenas noticias ${nombre}! ${exactos.length} buses</h3>`+exactos.map(s=>`<div class='result'>${cardContent(s,nombre)}</div>`).join('');}if(similares.length){html+=`<h3 style='color:#d10024;margin:14px 0 8px'>Búsquedas similares</h3>`+similares.map(s=>`<div class='result similar'>${cardContent(s,nombre)}</div>`).join('');}r.innerHTML=html;}
function cardContent(s,n){const d=document.getElementById('desdeBusca').value,h=document.getElementById('hastaBusca').value;return `<div><b>${s.empresa}</b> | ${s.hora} | R$ ${s.precio}<br><b>${s.desde} → ${s.hasta}</b></div><button class='btn' style='margin-top:8px' onclick='comprar(${s.id},"${n.replace(/"/g,'')}","${d.replace(/"/g,'')}","${h.replace(/"/g,'')}")'>Comprar</button>`;}
function qr(){let h='';for(let i=0;i<81;i++)h+=`<div class='${Math.random()>.5?'b':''}'></div>`;return h;}
window.comprar=(id,nombre,d,h)=>{const s=servicios.find(x=>x.id==id);const folio=('00'+Math.floor(Math.random()*9999999)).slice(-9);const oper=('00'+Math.floor(Math.random()*999999999)).slice(-9);const logoHtml=logoData?`<img src='${logoData}'>`:`<div class='txt-logo'>TMOM / ADO</div>`;document.getElementById('boletoReal').innerHTML=`<div class='compra'>COMPRA ANTICIPADA</div><div class='line-red-short'></div><div class='top'><div class='logo-box'>${logoHtml}</div><div class='qr-box'><div class='qr'>${qr()}</div><div style='font-size:9px'>ESCANEA TU BOLETO</div></div></div><div class='divider'></div><div class='field'><div class='lbl'>NOMBRE / NAME</div><div class='val'>${nombre}</div></div><div class='field'><div class='lbl'>OPERADOR</div><div class='val'>${s.operador}</div></div><div class='field'><div class='lbl'>EMPRESA</div><div class='val' style='font-size:18px'>${s.empresa}</div></div><div class='field'><div class='lbl'>ORIGEN</div><div class='val'>${d||s.desde}</div></div><div class='field'><div class='lbl'>DESTINO</div><div class='val'>${h||s.hasta}</div></div><div class='field'><div class='lbl'>FECHA</div><div class='val'>${s.dia||new Date().toLocaleDateString()}</div></div><div class='field'><div class='lbl'>HORA</div><div class='val'>${s.hora}</div></div><div class='field'><div class='lbl'>PRECIO</div><div class='val'>R$ ${s.precio}.00</div></div><div class='field small-val'><div class='lbl'>FOLIO</div><div class='val'>${folio}</div></div><div class='field small-val'><div class='lbl'>OPERACIÓN</div><div class='val'>${oper}</div></div><div class='divider'></div><div class='footer'><div class='legal'>CONSERVE SU BOLETO • AUTOBUSES TMOM / ADO<br>En caja virtual - Central TMOM/ADO</div><div><div class='barcode'></div><div style='font-size:9px'>${folio}${oper}</div></div></div>`;document.getElementById('boletoWrap').style.display='block';}
</script>
</body>
</html>
